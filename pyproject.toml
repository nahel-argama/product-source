[project]
name = "price-scrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.1",
    "fastapi>=0.135.2",
    "google-genai>=2.6.0",
    "pandas>=3.0.1",
    "requests>=2.33.1",
    "uvicorn>=0.32.0",
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "database*"]
exclude = ["data*", "collections*"]